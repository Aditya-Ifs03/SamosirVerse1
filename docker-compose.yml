services:
  postgres:
    image: postgres:16-alpine
    container_name: samosirverse-db
    restart: always
    environment:
      POSTGRES_DB: samosirverse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - samosirverse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samosirverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: samosirverse-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@samosirverse.id
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  samosirverse_data:
