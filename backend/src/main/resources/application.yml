server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: samosirverse-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/samosirverse}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:SamosirVerseSecretKey2026ModernTropicalEditorialSecureKeySamosirSuperStrong123}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}
